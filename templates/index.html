<!DOCTYPE html>
<html>
<head>
    <title>Code Snippet Repository</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Code Snippet Repository</h1>

    <form method="POST" action="/add">
        <input type="text" name="title" placeholder="Snippet Title" required><br>
        <textarea name="code" placeholder="Paste your code..." required></textarea><br>
        <button type="submit">Add Snippet</button>
    </form>

    <form method="POST" action="/search">
        <input type="text" name="query" placeholder="Search code...">
        <button type="submit">Search</button>
    </form>

    <hr>

    {% for snippet in snippets %}
        <div class="snippet">
            <h3>{{ snippet.title }} ({{ snippet.category }})</h3>
            <pre>{{ snippet.code }}</pre>
            <a href="{{ url_for('edit_snippet', id=snippet._id) }}">Edit</a> |
            <a href="{{ url_for('delete_snippet', id=snippet._id) }}" onclick="return confirm('Delete this snippet?');">Delete</a>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
